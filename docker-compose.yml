# ============================================================
# SafePath — production-style stack
#
#   docker compose up --build
#
# Services:
#   db    — PostgreSQL 17 (persistent volume)
#   api   — Express API (rate-limited, helmet-hardened)
#   web   — nginx serving the built React SPA, proxying /api
#
# Set a strong JWT_SECRET in production (see README).
# ============================================================
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: safepath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safepath}
      POSTGRES_DB: safepath
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepath -d safepath"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init:
    build: ./backend
    command: ["sh", "/app/db/init-docker.sh"]
    environment:
      DATABASE_URL: postgres://safepath:${POSTGRES_PASSWORD:-safepath}@db:5432/safepath
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgres://safepath:${POSTGRES_PASSWORD:-safepath}@db:5432/safepath
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (e.g. openssl rand -hex 32)}
      JWT_EXPIRES: 8h
      TRUST_PROXY: "true"
      RATE_WINDOW_MS: 600000
      RATE_MAX: 60
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data: