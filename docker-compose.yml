# ============================================================
# Nathara Safe Campus — production-style stack
#
#   bunx --bun compose up --build   (atau: docker compose up --build)
#
# Services:
#   db    — PostgreSQL 18 (persistent volume)
#   api   — Express API (SSO Supabase prod, rate-limited, helmet-hardened)
#   web   — nginx serving the built React SPA, proxying /api
#
# Auth = SSO Supabase prod (RS256 via JWKS). Tidak ada secret lokal
# lagi — rahasia server-side hanya POSTGRES_PASSWORD +
# DATABASE_URL via file VPS. service_role HARAM di sini.
# ============================================================
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: safe_campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safe_campus}
      POSTGRES_DB: safe_campus
    volumes:
      - safe-campus-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_campus -d safe_campus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  init:
    build: ./backend
    command: ["sh", "/app/db/init-docker.sh"]
    environment:
      DATABASE_URL: postgres://safe_campus:${POSTGRES_PASSWORD:-safe_campus}@db:5432/safe_campus
      SSO_JWKS_URL: ${SSO_JWKS_URL:-https://api.nathara.ac.id/functions/v1/sso-jwks}
      SSO_ISSUER: ${SSO_ISSUER:-https://sso.nathara.ac.id}
      SSO_AUDIENCE: ${SSO_AUDIENCE:-ppkpt}
      SEED_ADMIN_SUB: ${SEED_ADMIN_SUB:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Safe Campus Admin}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    command: ["bun", "server.js"]
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgres://safe_campus:${POSTGRES_PASSWORD:-safe_campus}@db:5432/safe_campus
      SSO_JWKS_URL: ${SSO_JWKS_URL:-https://api.nathara.ac.id/functions/v1/sso-jwks}
      SSO_ISSUER: ${SSO_ISSUER:-https://sso.nathara.ac.id}
      SSO_AUDIENCE: ${SSO_AUDIENCE:-ppkpt}
      TRUST_PROXY: "true"
      RATE_WINDOW_MS: 600000
      RATE_MAX: 20
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-https://ppkpt.nathara.ac.id}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: safe-campus-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default
      - siakad-network

volumes:
  safe-campus-postgres-data:

networks:
  siakad-network:
    external: true
